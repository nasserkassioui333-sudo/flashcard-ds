</head>

<div class="container" id="app">

  <!-- MENU -->
  <div id="menu-screen">

let deck = [], idx = 0, selected = null, revealed = false;
let score = 0, answered = 0, errors = [], allErrors = [];

function shuffle(a) {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function show(id) { document.getElementById(id).classList.remove("hidden"); }
function hide(id) { document.getElementById(id).classList.add("hidden"); }
function $(id) { return document.getElementById(id); }

function goMenu() {
  hide("quiz-screen"); show("menu-screen");
  $("menu-count").textContent = QUESTIONS.length + " questions";
  if (allErrors.length > 0) {
    show("btn-review");
    $("error-count").textContent = allErrors.length;
  } else {
    hide("btn-review");
  }
}

function startQuiz(type) {
  if (type === "quick") {
    deck = shuffle(QUESTIONS).slice(0, 30);
  } else {
    deck = shuffle(QUESTIONS);
  }
  idx = 0; selected = null; revealed = false;
  score = 0; answered = 0; errors = [];
  hide("menu-screen"); show("quiz-screen");
  hide("finish-bar"); hide("result-box"); show("nav-bar");
  $("quiz-label").textContent = "Quiz";
  render();
}

function startReview() {
  if (allErrors.length === 0) return;
  deck = shuffle(allErrors);
  idx = 0; selected = null; revealed = false;
  score = 0; answered = 0; errors = []; allErrors = [];
  hide("menu-screen"); show("quiz-screen");
  hide("finish-bar"); hide("result-box"); show("nav-bar");
  $("quiz-label").textContent = "R\u00e9vision erreurs";
  render();
}

function handleSelect(i) {
  if (revealed) return;
  selected = i;
  revealed = true;
  answered++;
  if (i === deck[idx].answer) {
    score++;
  } else {
    errors.push(deck[idx]);
    allErrors.push(deck[idx]);
  }
  render();
}

function goNext() {
  if (!revealed || idx >= deck.length - 1) return;
  idx++; selected = null; revealed = false;
  render();
}

function goPrev() {
  if (idx <= 0) return;
  idx--; selected = null; revealed = false;
  render();
}

function render() {
  const q = deck[idx];
  const pct = answered > 0 ? Math.round((score / answered) * 100) : 0;
  const finished = idx === deck.length - 1 && revealed;

  $("score-pill").innerHTML = score + " / " + answered +
    (answered > 0 ? ' <span class="score-pct">\u00b7 ' + pct + "%</span>" : "");
  $("progress-text").textContent = (idx + 1) + " / " + deck.length;
  $("progress-fill").style.width = ((idx + 1) / deck.length * 100) + "%";
  $("question-text").textContent = q.q;

  // Choices
  const container = $("choices-container");
  container.innerHTML = "";
  q.choices.forEach((c, i) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    if (revealed) {
      btn.classList.add("revealed");
      if (i === q.answer) btn.classList.add("correct");
      else if (i === selected) btn.classList.add("wrong");
    }
    btn.innerHTML = '<span class="choice-letter">' + LETTERS[i] + "</span><span>" + c + "</span>";
    btn.onclick = () => handleSelect(i);
    container.appendChild(btn);
  });

  // Feedback
  if (revealed) {
    show("feedback");
    const fb = $("feedback");
    if (selected === q.answer) {
      fb.className = "feedback ok";
      fb.textContent = "\u2713 Bonne r\u00e9ponse !";
    } else {
      fb.className = "feedback ko";
      fb.textContent = "\u2717 Mauvaise r\u00e9ponse. La bonne r\u00e9ponse \u00e9tait : " + LETTERS[q.answer];
    }
  } else {
    hide("feedback");
  }

  // Nav
  $("btn-prev").disabled = idx === 0;
  $("btn-next").disabled = !revealed;

  if (finished) {
    hide("nav-bar");
    show("finish-bar");
    show("result-box");
    if (errors.length > 0) {
      show("btn-review-end");
      $("error-count-end").textContent = errors.length;
    } else {
      hide("btn-review-end");
    }
    $("result-pct").textContent = pct + "%";
    $("result-pct").style.color = pct >= 80 ? "#00b894" : pct >= 50 ? "#fdcb6e" : "#e17055";
    $("result-detail").textContent = score + " bonnes r\u00e9ponses sur " + answered + " \u2022 " + errors.length + " erreur" + (errors.length > 1 ? "s" : "");
    $("result-msg").textContent = pct >= 80 ? "Excellent !" : pct >= 50 ? "Pas mal, continue !" : "Continue de r\u00e9viser !";
  } else {
    show("nav-bar");
    hide("finish-bar");
    hide("result-box");
  }
}

// Init
goMenu();
</script>
